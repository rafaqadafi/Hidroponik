; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Credential lokal dibaca dari platformio_override.ini yang di-ignore Git.
extra_configs = platformio_override.ini

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200

; ESP32-S3 N16R8: 16 MB flash + 8 MB Octal PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

build_src_filter =
    +<*>
    -<PH/PhTemperatureCalibration.cpp>
    -<Turbidity/TurbidityCalibration.cpp>

lib_deps =
    adafruit/Adafruit ADS1X15
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    tzapu/WiFiManager
    knolleary/PubSubClient

; Upload OTA setelah firmware pertama berhasil di-upload lewat USB.
[env:esp32-s3-devkitc-1-n16r8-ota]
extends = env:esp32-s3-devkitc-1-n16r8
upload_protocol = espota
upload_port = hidroponik-esp32.local
upload_flags =
    --port=3232
